[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; After the first USB flash: pio run -e d1_mini_ota -t upload
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = plant-pot.local
